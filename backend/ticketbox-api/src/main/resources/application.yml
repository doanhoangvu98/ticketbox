# Default configuration. Secrets come from environment variables (see .env.example).
spring:
  application:
    name: ticketbox-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketbox}
    username: ${DB_USERNAME:ticketbox}
    password: ${DB_PASSWORD:ticketbox}

  jpa:
    # Schema is owned by Flyway. Hibernate only checks entities match the tables.
    hibernate:
      ddl-auto: validate
    # Disable "Open Session In View": lazy loading outside a transaction fails fast
    # instead of silently running queries during JSON serialization. See ADR-009.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50          # batch INSERT of seats (needs SEQUENCE ids)
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100        # protects the DB from ?size=1000000

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
