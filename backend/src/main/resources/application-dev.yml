# Local development: SPRING_PROFILES_ACTIVE=dev
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # demo data only in dev
    # Benchmark (docs/BENCHMARK.md): uncomment to stop before the index migration V2.
    # target: "1.1"
  jpa:
    properties:
      hibernate:
        generate_statistics: true   # query count per session, proves the N+1 fix

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.stat: debug
    com.noah.ticketbox: debug
